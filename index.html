<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marina Recipes — Alexa Skill by Kay Quade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080d14;
      --surface:   #0e1520;
      --card:      #111d2e;
      --border:    #1a2d42;
      --text:      #dde8f5;
      --muted:     #526070;
      --teal:      #00c9b1;
      --teal-dim:  rgba(0,201,177,.15);
      --blue:      #00b0ff;
      --blue-dk:   #0078d7;
      --orange:    #ffaa00;
      --green:     #00e676;
      --user-bg:   #0f2744;
      --alexa-bg:  #091929;
      --step-done: #1a3a2a;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── Page layout ── */
    .page {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      max-width: 980px;
      margin: 0 auto;
      gap: 0;
    }

    /* ── Top bar ── */
    .topbar {
      grid-column: 1 / -1;
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #007a6b, #00c9b1);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .topbar-text h1 { font-size: 1rem; font-weight: 700; color: var(--text); }
    .topbar-text p  { font-size: .72rem; color: var(--muted); margin-top: 1px; }

    .topbar-badge {
      margin-left: auto;
      font-size: .65rem;
      padding: 3px 10px;
      border-radius: 10px;
      background: var(--teal-dim);
      border: 1px solid rgba(0,201,177,.3);
      color: var(--teal);
      font-weight: 600;
      letter-spacing: .06em;
    }

    .btn-mute {
      background: rgba(0,201,177,.1);
      border: 1px solid rgba(0,201,177,.25);
      color: var(--teal);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: .95rem;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-mute:hover  { background: rgba(0,201,177,.2); }
    .btn-mute.muted  { background: rgba(255,255,255,.04); border-color: var(--border); color: var(--muted); }

    /* ── Left panel ── */
    .panel-left {
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── Mic device ── */
    .mic-device {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Orb: holds the rings + core together, sized to the core */
    .mic-orb {
      position: relative;
      width: 114px;
      height: 114px;
    }

    /* Expanding ripple rings */
    .mic-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid currentColor;
      color: transparent;
      opacity: 0;
      pointer-events: none;
      transform-origin: center;
    }

    /* Core circle with mic icon */
    .mic-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #0e1520;
      border: 2px solid #1a2d42;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .4s, border-color .4s, box-shadow .4s;
      box-shadow: 0 4px 28px rgba(0,0,0,.65);
      z-index: 2;
    }

    .mic-icon {
      width: 46px;
      height: 46px;
      color: var(--muted);
      transition: color .4s;
      /* slight drop shadow on the SVG for depth */
      filter: drop-shadow(0 0 0px transparent);
    }

    /* ── LISTENING — blue sonar ripples ── */
    .s-listening .mic-core {
      background: rgba(0,176,255,.09);
      border-color: var(--blue);
      box-shadow: 0 0 32px rgba(0,176,255,.32), 0 4px 28px rgba(0,0,0,.65);
    }
    .s-listening .mic-icon {
      color: var(--blue);
      filter: drop-shadow(0 0 6px rgba(0,176,255,.7));
    }
    .s-listening .mic-ring {
      color: var(--blue);
      animation: mic-ripple 2s ease-out infinite;
    }
    .s-listening .mic-ring:nth-child(2) { animation-delay: .66s; }
    .s-listening .mic-ring:nth-child(3) { animation-delay: 1.33s; }

    /* ── THINKING — orange slow breathe ── */
    .s-thinking .mic-core {
      background: rgba(255,170,0,.09);
      border-color: var(--orange);
      box-shadow: 0 0 32px rgba(255,170,0,.32), 0 4px 28px rgba(0,0,0,.65);
      animation: core-throb .9s ease-in-out infinite;
    }
    .s-thinking .mic-icon {
      color: var(--orange);
      filter: drop-shadow(0 0 6px rgba(255,170,0,.7));
    }
    .s-thinking .mic-ring {
      color: var(--orange);
      animation: mic-breathe 2.7s ease-in-out infinite;
    }
    .s-thinking .mic-ring:nth-child(2) { animation-delay: .9s; }
    .s-thinking .mic-ring:nth-child(3) { animation-delay: 1.8s; }

    /* ── SPEAKING — teal fast ripples ── */
    .s-speaking .mic-core {
      background: rgba(0,201,177,.09);
      border-color: var(--teal);
      box-shadow: 0 0 32px rgba(0,201,177,.32), 0 4px 28px rgba(0,0,0,.65);
    }
    .s-speaking .mic-icon {
      color: var(--teal);
      filter: drop-shadow(0 0 6px rgba(0,201,177,.7));
    }
    .s-speaking .mic-ring {
      color: var(--teal);
      animation: mic-ripple 1.3s ease-out infinite;
    }
    .s-speaking .mic-ring:nth-child(2) { animation-delay: .43s; }
    .s-speaking .mic-ring:nth-child(3) { animation-delay: .86s; }

    /* State label */
    .state-label {
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 22px;
      color: var(--muted);
      transition: color .3s;
    }
    .s-listening .state-label { color: var(--blue); }
    .s-thinking  .state-label { color: var(--orange); }
    .s-speaking  .state-label { color: var(--teal); }

    /* ── Keyframes ── */
    @keyframes mic-ripple {
      0%   { transform: scale(1);   opacity: .65; }
      100% { transform: scale(2.5); opacity: 0;   }
    }
    @keyframes mic-breathe {
      0%,100% { transform: scale(1.1); opacity: .5; }
      50%      { transform: scale(1.8); opacity: .08; }
    }
    @keyframes core-throb {
      0%,100% { box-shadow: 0 0 20px rgba(255,170,0,.22), 0 4px 28px rgba(0,0,0,.65); }
      50%      { box-shadow: 0 0 44px rgba(255,170,0,.55), 0 4px 28px rgba(0,0,0,.65); }
    }

    /* ── Scenario tabs ── */
    .tabs-label {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      align-self: flex-start;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .18s;
      text-align: left;
    }
    .tab:hover { background: var(--card); color: var(--text); }
    .tab.active {
      background: var(--card);
      border-color: var(--border);
      color: var(--teal);
    }
    .tab-icon { font-size: 1rem; }
    .tab-name { flex: 1; }
    .tab-count {
      font-size: .65rem;
      padding: 1px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,.05);
      color: var(--muted);
    }

    /* ── Controls ── */
    .ctrl-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .03em;
      cursor: pointer;
      transition: transform .12s, opacity .2s;
    }
    .btn:hover   { transform: translateY(-1px); }
    .btn:active  { transform: translateY(0); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .btn-play  { background: linear-gradient(135deg, #007a6b, var(--teal)); color: #fff; }
    .btn-reset { background: var(--card); border: 1px solid var(--border); color: var(--muted); }

    /* ── Right panel ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      padding: 24px 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 320px;
      max-height: 420px;
    }

    .bubble {
      max-width: 84%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: .82rem;
      line-height: 1.55;
      animation: pop-in .25s ease both;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 3px;
      color: #b8d4f0;
    }
    .bubble.user::before { content: '🎙 '; font-size: .72em; }
    .bubble.alexa {
      align-self: flex-start;
      background: var(--alexa-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: #9ecfee;
    }
    .bubble.alexa::before { content: '◉ '; color: var(--teal); font-size: .72em; }

    .typing-ind {
      display: flex;
      gap: 4px;
      padding: 9px 14px;
      align-self: flex-start;
      background: var(--alexa-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 3px;
      animation: pop-in .25s ease both;
    }
    .tdot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--teal);
      animation: tdot-anim .85s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .2s; }
    .tdot:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot-anim {
      0%,80%,100% { transform: scale(.5); opacity: .3; }
      40%          { transform: scale(1);  opacity: 1;  }
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(6px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Recipe card ── */
    .recipe-panel {
      border-top: 1px solid var(--border);
      padding: 16px 24px 20px;
      min-height: 120px;
    }

    .recipe-card {
      display: none;
      animation: pop-in .3s ease both;
    }
    .recipe-card.visible { display: block; }

    .recipe-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .recipe-emoji { font-size: 1.4rem; }
    .recipe-name  { font-size: .9rem; font-weight: 700; color: var(--text); }
    .recipe-meal  { font-size: .68rem; color: var(--teal); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-top: 1px; }

    .recipe-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .recipe-section-title {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .ingredient-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .ingredient-list li {
      font-size: .75rem;
      color: #8aa8c0;
      padding-left: 10px;
      position: relative;
    }
    .ingredient-list li::before {
      content: '·';
      position: absolute;
      left: 0;
      color: var(--teal);
    }

    .step-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .step-item {
      display: flex;
      gap: 8px;
      font-size: .75rem;
      color: #8aa8c0;
      transition: color .3s, background .3s;
      padding: 3px 6px;
      border-radius: 5px;
    }
    .step-item.active {
      background: rgba(0,201,177,.08);
      color: var(--teal);
    }
    .step-item.done {
      background: var(--step-done);
      color: #4a8a6a;
    }
    .step-num {
      font-size: .65rem;
      font-weight: 700;
      color: var(--teal);
      min-width: 16px;
      margin-top: 1px;
      opacity: .7;
    }
    .step-item.done .step-num { color: #4a8a6a; }

    /* empty state */
    .recipe-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 80px;
      color: var(--muted);
      font-size: .78rem;
    }

    /* progress bar */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px 0;
    }
    .progress-label { font-size: .65rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill  { height: 100%; background: var(--teal); border-radius: 2px; width: 0%; transition: width .4s ease; }
    .progress-pct   { font-size: .65rem; color: var(--teal); font-weight: 600; min-width: 28px; text-align: right; }
  </style>
</head>
<body>
<div class="page">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-icon">🍳</div>
    <div class="topbar-text">
      <h1>Marina Recipes</h1>
      <p>5 Minute Recipes · Alexa Skill by Kay Quade</p>
    </div>
    <button class="btn-mute" id="btn-mute" title="Toggle voice narration">🔊</button>
    <div class="topbar-badge">ALEXA SKILL DEMO</div>
  </header>

  <!-- Left panel -->
  <aside class="panel-left">

    <!-- Mic orb device -->
    <div class="mic-device" id="echo">
      <div class="mic-orb">
        <div class="mic-ring"></div>
        <div class="mic-ring"></div>
        <div class="mic-ring"></div>
        <div class="mic-core">
          <!-- Microphone SVG -->
          <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
            <path d="M12 2a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-7 0v-6A3.5 3.5 0 0 1 12 2zm0 1.5A2 2 0 0 0 10 5.5v6a2 2 0 0 0 4 0v-6A2 2 0 0 0 12 3.5zM6.5 11.5h1.25a4.25 4.25 0 0 0 8.5 0h1.25A5.5 5.5 0 0 1 12.75 16.9V19h2.25v1.5h-6V19h2.25v-2.1A5.5 5.5 0 0 1 6.5 11.5z"/>
          </svg>
        </div>
      </div>
      <div class="state-label" id="state-label">Idle</div>
    </div>

    <!-- Scenario tabs -->
    <span class="tabs-label">Try a scenario</span>
    <div class="tabs" id="tabs"></div>

    <!-- Controls -->
    <div class="ctrl-row">
      <button class="btn btn-play"  id="btn-play">▶ Play</button>
      <button class="btn btn-reset" id="btn-reset">↺ Reset</button>
    </div>

  </aside>

  <!-- Right panel -->
  <main class="panel-right">

    <!-- Progress -->
    <div class="progress-row">
      <span class="progress-label">Progress</span>
      <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
      <span class="progress-pct" id="prog-pct">0%</span>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chat"></div>

    <!-- Recipe card -->
    <div class="recipe-panel">
      <div class="recipe-placeholder" id="recipe-placeholder">
        <span style="opacity:.4">🍽</span>
        <span>Recipe details will appear here during the demo</span>
      </div>
      <div class="recipe-card" id="recipe-card">
        <div class="recipe-header">
          <span class="recipe-emoji" id="rc-emoji"></span>
          <div>
            <div class="recipe-name" id="rc-name"></div>
            <div class="recipe-meal" id="rc-meal"></div>
          </div>
        </div>
        <div class="recipe-cols">
          <div>
            <div class="recipe-section-title">Ingredients</div>
            <ul class="ingredient-list" id="rc-ingredients"></ul>
          </div>
          <div>
            <div class="recipe-section-title">Steps</div>
            <ol class="step-list" id="rc-steps"></ol>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<script>

//  DATA (pulled directly from index.js)
// ────────────────────────────────────────────────────────────

// ────────────────────────────────────────────────────────────
//  SCENARIOS — realistic dialogues from the actual skill
// ────────────────────────────────────────────────────────────
const SCENARIOS = [
  {
    id: 'breakfast', label: 'Breakfast', icon: '☀️',
    meal: 'breakfast', recipe: 'avocado_toast',
    script: [
      { type:'user',  text:'Alexa, open Marina Recipes',                                                                                                                                                                                                                    pause:1000 },
      { type:'alexa', text:'Good morning! I\'m Marina from 5 Minute Recipes. Since it\'s breakfast time, how about some scrambled eggs or avocado toast? Or I can help with lunch, dinner, or snacks too. What would you like?',                                             pause:1600 },
      { type:'user',  text:'I want breakfast',                                                                                                                                                                                                                               pause:1000 },

// ────────────────────────────────────────────────────────────
//  TEXT-TO-SPEECH ENGINE  (Web Speech API — no libraries)
// ────────────────────────────────────────────────────────────
const TTS = {
  muted: false,
  voice: null,
  rate:  0.82,   // slightly slower than default (1.0) — clear & natural
  pitch: 1.08,   // just a touch higher — Alexa-ish

  init() {
    if (!window.speechSynthesis) return;
    const pick = () => {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      // Preferred voices in priority order
      const want = [
        'Google UK English Female',
        'Samantha',                                      // macOS / iOS
        'Karen',                                         // macOS
        'Moira',                                         // macOS
        'Microsoft Zira Desktop - English (United States)',
        'Microsoft Zira - English (United States)',
      ];
      for (const name of want) {
        const v = voices.find(v => v.name === name);
        if (v) { this.voice = v; return; }
      }
      // Fallback: any English voice (index 1 is often female in Chrome)
      const en = voices.filter(v => v.lang.startsWith('en'));
      this.voice = en[1] || en[0] || voices[0] || null;
    };
    pick();
    speechSynthesis.addEventListener('voiceschanged', pick);
  },

  // Returns a Promise that resolves when speech is finished (or immediately if muted)
  speak(text) {
    return new Promise(resolve => {
      if (this.muted || !window.speechSynthesis) { resolve(); return; }
      speechSynthesis.cancel();
      const utt    = new SpeechSynthesisUtterance(text);
      utt.rate     = this.rate;
      utt.pitch    = this.pitch;
      if (this.voice) utt.voice = this.voice;
      // Safety timeout — some browsers never fire onend
      const guard  = setTimeout(resolve, text.length * 75 + 2500);
      utt.onend    = () => { clearTimeout(guard); resolve(); };
      utt.onerror  = () => { clearTimeout(guard); resolve(); };
      speechSynthesis.speak(utt);
    });
  },

  cancel() { if (window.speechSynthesis) speechSynthesis.cancel(); },
  toggle() { this.muted = !this.muted; if (this.muted) this.cancel(); }
};
TTS.init();

// ────────────────────────────────────────────────────────────
//  STATE
// ────────────────────────────────────────────────────────────
let currentScenario = SCENARIOS[0];
let running = false;
let stepIdx = 0;

const echo       = document.getElementById('echo');
const stateLabel = document.getElementById('state-label');
const chat       = document.getElementById('chat');
const btnPlay    = document.getElementById('btn-play');
const btnReset   = document.getElementById('btn-reset');
const btnMute    = document.getElementById('btn-mute');
const progFill   = document.getElementById('prog-fill');
const progPct    = document.getElementById('prog-pct');
const recipeCard        = document.getElementById('recipe-card');
const recipePlaceholder = document.getElementById('recipe-placeholder');
const rcEmoji       = document.getElementById('rc-emoji');
const rcName        = document.getElementById('rc-name');
const rcMeal        = document.getElementById('rc-meal');
const rcIngredients = document.getElementById('rc-ingredients');
const rcSteps       = document.getElementById('rc-steps');

// Mute button
btnMute.addEventListener('click', () => {
  TTS.toggle();
  btnMute.textContent = TTS.muted ? '🔇' : '🔊';
  btnMute.classList.toggle('muted', TTS.muted);
  btnMute.title = TTS.muted ? 'Click to enable voice' : 'Click to mute voice';
});
// Hide button if browser has no TTS
if (!window.speechSynthesis) btnMute.style.display = 'none';

// Build tabs
const tabsEl = document.getElementById('tabs');
SCENARIOS.forEach(sc => {
  const btn = document.createElement('button');
  const recipeCount = Object.keys(MEAL_DATA[sc.meal].recipes).length;
  btn.className = 'tab' + (sc === currentScenario ? ' active' : '');
  btn.innerHTML = `<span class="tab-icon">${sc.icon}</span><span class="tab-name">${sc.label}</span><span class="tab-count">${recipeCount} recipes</span>`;
  btn.addEventListener('click', () => {
    if (running) return;
    currentScenario = sc;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    reset();
  });
  tabsEl.appendChild(btn);
});

// ── Helpers ──
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function setState(s) {
  echo.classList.remove('s-listening','s-thinking','s-speaking');
  if (s) echo.classList.add('s-' + s);
  const map = { listening:'Listening…', thinking:'Thinking…', speaking:'Speaking', '':'Idle' };
  stateLabel.textContent = map[s] || 'Idle';
}

function setProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  progFill.style.width = pct + '%';
  progPct.textContent  = pct + '%';
}

function addBubble(type, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + type;
  b.textContent = text;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const t = document.createElement('div');
  t.className = 'typing-ind';
  t.id = 'typing-ind';
  t.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typing-ind');
  if (t) t.remove();
}

function showRecipeCard(mealKey, recipeKey) {
  const recipe = MEAL_DATA[mealKey].recipes[recipeKey];
  if (!recipe) return;
  rcEmoji.textContent = recipe.emoji;
  rcName.textContent  = recipe.name;
  rcMeal.textContent  = mealKey.toUpperCase();
  rcIngredients.innerHTML = '';
  recipe.ingredients.forEach(ing => {
    const li = document.createElement('li');
    li.textContent = ing;
    rcIngredients.appendChild(li);
  });
  rcSteps.innerHTML = '';
  recipe.steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'step-item';
    li.id = 'step-' + i;
    li.innerHTML = `<span class="step-num">${i + 1}</span><span>${step}</span>`;
    rcSteps.appendChild(li);
  });
  recipePlaceholder.style.display = 'none';
  recipeCard.classList.add('visible');
}

function highlightStep(index) {
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.remove('active','done');
    if (i < index)  el.classList.add('done');
    if (i === index) el.classList.add('active');
  });
}

function resetRecipeCard() {
  recipeCard.classList.remove('visible');
  recipePlaceholder.style.display = '';
  rcIngredients.innerHTML = '';
  rcSteps.innerHTML = '';
}

// ── Main runner ──
async function runScript() {
  running = true;
  btnPlay.disabled = true;
  const script = currentScenario.script;
  const total  = script.length;

  for (let i = stepIdx; i < script.length; i++) {
    stepIdx = i;
    const step = script[i];
    setProgress(i, total);

    if (step.type === 'user') {
      setState('listening');
      await wait(500);
      addBubble('user', step.text);
      setState('thinking');
      addTyping();
      await wait(step.pause);
      removeTyping();
    } else {
      setState('speaking');
      addBubble('alexa', step.text);

      if (step.showRecipe) {
        await wait(300);
        showRecipeCard(currentScenario.meal, currentScenario.recipe);
      }
      if (step.activeStep !== undefined) {
        highlightStep(step.activeStep);
      }

      if (!TTS.muted && window.speechSynthesis) {
        // Speaking animation stays on while TTS is actually talking
        await TTS.speak(step.text);
        await wait(350);         // short breath between lines
      } else {
        await wait(step.pause + 300);   // fallback: timer-based like before
      }

      setState('');
      await wait(200);
    }
  }

  setProgress(total, total);
  stepIdx = script.length;
  running = false;
  btnPlay.disabled = false;
  btnPlay.textContent = '▶ Replay';
}

function reset() {
  if (running) return;
  TTS.cancel();
  stepIdx = 0;
  setState('');
  chat.innerHTML = '';
  resetRecipeCard();
  setProgress(0, 1);
  btnPlay.textContent = '▶ Play';
  btnPlay.disabled = false;
}

btnPlay.addEventListener('click',  () => { if (!running) runScript(); });
btnReset.addEventListener('click', reset);
</script>
