<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alexa Skill Demo</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0e1a;
      --card:      #111827;
      --border:    #1e2d45;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --blue:      #00b0ff;
      --blue-dark: #0078d7;
      --orange:    #ff9800;
      --green:     #00e676;
      --user-bg:   #1e3a5f;
      --alexa-bg:  #0d2137;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Layout ── */
    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 20px;
      width: 100%;
      max-width: 520px;
    }

    /* ── Header ── */
    .header { text-align: center; }
    .header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
    .header p  { font-size: .8rem; color: var(--muted); margin-top: 4px; }

    /* ── Echo device ── */
    .echo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .echo-body {
      position: relative;
      width: 88px;
      height: 160px;
      background: linear-gradient(160deg, #2a2f3e 0%, #1a1e28 60%, #12151f 100%);
      border-radius: 44px;
      box-shadow:
        4px 8px 24px rgba(0,0,0,.7),
        inset -3px -6px 14px rgba(0,0,0,.4),
        inset 2px 3px 6px rgba(255,255,255,.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 14px;
      overflow: visible;
    }

    /* fabric texture lines */
    .echo-body::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,.025) 3px,
        rgba(255,255,255,.025) 4px
      );
    }

    /* top dome highlight */
    .echo-body::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.08) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* ── Ring ── */
    .ring-container {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 20px;
    }

    .ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
    }

    /* Idle: dim ring */
    .ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,176,255,.12) 0%, transparent 70%);
      transition: opacity .4s;
    }

    /* Animated ring overlay */
    .ring-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      transition: opacity .4s;
    }

    /* ── States ── */

    /* LISTENING — blue spinning arc */
    .state-listening .ring-glow {
      opacity: 1;
      background: conic-gradient(
        var(--blue) 0deg,
        rgba(0,176,255,.3) 60deg,
        transparent 90deg,
        transparent 360deg
      );
      animation: spin 1.2s linear infinite;
      filter: blur(1px);
    }

    /* THINKING — orange pulsing */
    .state-thinking .ring-glow {
      opacity: 1;
      background: radial-gradient(ellipse, var(--orange) 0%, rgba(255,152,0,.2) 60%, transparent 80%);
      animation: pulse-orange 0.9s ease-in-out infinite;
    }

    /* SPEAKING — cyan wave shimmer */
    .state-speaking .ring-glow {
      opacity: 1;
      background: conic-gradient(
        var(--blue) 0deg,
        var(--green) 90deg,
        var(--blue) 180deg,
        var(--green) 270deg,
        var(--blue) 360deg
      );
      animation: spin-slow 2s linear infinite;
      filter: blur(0.5px);
    }

    @keyframes spin         { to { transform: rotate(360deg); } }
    @keyframes spin-slow    { to { transform: rotate(360deg); } }
    @keyframes pulse-orange {
      0%, 100% { transform: scale(1);   opacity: 1;   }
      50%       { transform: scale(1.15); opacity: .6; }
    }

    /* ── LED dot on body ── */
    .led {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #1a2030;
      box-shadow: 0 0 0 1px rgba(255,255,255,.05);
      transition: background .3s, box-shadow .3s;
      position: relative;
      z-index: 1;
    }
    .state-listening .led { background: var(--blue);   box-shadow: 0 0 10px var(--blue); }
    .state-thinking  .led { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    .state-speaking  .led { background: var(--green);  box-shadow: 0 0 10px var(--green); }

    /* ── Sound waves (shown when speaking) ── */
    .waves {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 4px;
      align-items: center;
      opacity: 0;
      transition: opacity .3s;
    }
    .waves.left  { right: calc(100% + 18px); }
    .waves.right { left:  calc(100% + 18px); }

    .state-speaking ~ .waves,
    .state-speaking .waves { opacity: 1; }

    /* target the waves siblings */
    .echo-wrap.state-speaking .waves { opacity: 1; }

    .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--blue);
      animation: bar-wave 0.8s ease-in-out infinite;
    }
    .bar:nth-child(1) { height: 8px;  animation-delay: 0s;    }
    .bar:nth-child(2) { height: 16px; animation-delay: .12s;  }
    .bar:nth-child(3) { height: 22px; animation-delay: .24s;  }
    .bar:nth-child(4) { height: 16px; animation-delay: .36s;  }
    .bar:nth-child(5) { height: 8px;  animation-delay: .48s;  }

    .waves.left  .bar { animation-direction: normal; }
    .waves.right .bar { animation-direction: reverse; }

    @keyframes bar-wave {
      0%, 100% { transform: scaleY(.4); opacity: .5; }
      50%       { transform: scaleY(1);  opacity: 1;  }
    }

    /* ── State label ── */
    .state-label {
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 28px;
      color: var(--muted);
      min-height: 1em;
      transition: color .3s;
    }
    .echo-wrap.state-listening .state-label { color: var(--blue);   content: 'Listening…'; }
    .echo-wrap.state-thinking  .state-label { color: var(--orange); }
    .echo-wrap.state-speaking  .state-label { color: var(--green);  }

    /* ── Chat feed ── */
    .chat {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 120px;
    }

    .bubble {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: .85rem;
      line-height: 1.5;
      animation: bubble-in .3s ease both;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #c5daf7;
    }
    .bubble.user::before {
      content: '🎙 ';
      font-size: .75em;
    }

    .bubble.alexa {
      align-self: flex-start;
      background: var(--alexa-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: #a5d8ff;
    }
    .bubble.alexa::before {
      content: '◉ ';
      color: var(--blue);
      font-size: .75em;
    }

    @keyframes bubble-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 10px 14px;
      align-self: flex-start;
      background: var(--alexa-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      animation: bubble-in .3s ease both;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--blue);
      animation: typing-dot .9s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes typing-dot {
      0%, 80%, 100% { transform: scale(.6); opacity: .4; }
      40%           { transform: scale(1);  opacity: 1;  }
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 9px 22px;
      border-radius: 24px;
      border: none;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    .btn:hover  { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .btn:active { transform: translateY(0);    box-shadow: none; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      color: #fff;
    }
    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── Skill badge ── */
    .skill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .7rem;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(0,176,255,.08);
      border: 1px solid rgba(0,176,255,.2);
      color: var(--blue);
      letter-spacing: .05em;
      font-weight: 600;
    }

    /* ── Progress dots ── */
    .progress {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .pdot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: background .3s, transform .3s;
    }
    .pdot.active { background: var(--blue); transform: scale(1.3); }
    .pdot.done   { background: var(--muted); }
  </style>
</head>
<body>
<div class="scene">

  <!-- Header -->
  <div class="header">
    <div class="skill-badge">
      <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor" opacity=".3"/><circle cx="5" cy="5" r="2" fill="currentColor"/></svg>
      ALEXA SKILL
    </div>
    <h1 style="margin-top:10px" id="skill-title">My Alexa Skill</h1>
    <p id="skill-subtitle">Interactive voice skill demo</p>
  </div>

  <!-- Echo device + waves -->
  <div class="echo-wrap" id="echo">
    <!-- left waves -->
    <div class="waves left">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div>
    </div>

    <div class="echo-body">
      <div class="ring-container">
        <div class="ring">
          <div class="ring-glow"></div>
        </div>
      </div>
      <div class="led"></div>
    </div>

    <!-- right waves -->
    <div class="waves right">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div>
    </div>

    <div class="state-label" id="state-label">Idle</div>
  </div>

  <!-- Progress -->
  <div class="progress" id="progress"></div>

  <!-- Chat feed -->
  <div class="chat" id="chat"></div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btn-play">▶ Start Demo</button>
    <button class="btn btn-secondary" id="btn-reset">↺ Reset</button>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
//  SKILL CONFIGURATION — edit this section
// ─────────────────────────────────────────────
const SKILL = {
  title:    "My Alexa Skill",       // ← your skill name
  subtitle: "Interactive voice skill demo",
  // Conversation steps: each step is one exchange
  // type: "user" | "alexa"
  // pause: ms to wait before showing next bubble
  script: [
    { type: "user",  text: "Alexa, open my skill",                          pause: 1200 },
    { type: "alexa", text: "Welcome! I'm ready to help you. What would you like to do?", pause: 1400 },
    { type: "user",  text: "Tell me something interesting",                 pause: 1200 },
    { type: "alexa", text: "Did you know? Honey never spoils — archaeologists have found 3000-year-old honey in Egyptian tombs that was still perfectly edible!", pause: 1800 },
    { type: "user",  text: "That's cool! Can I hear another one?",          pause: 1200 },
    { type: "alexa", text: "Sure! A day on Venus is longer than a year on Venus — it rotates so slowly that it completes an orbit around the sun before finishing one rotation.", pause: 2000 },
    { type: "user",  text: "Stop",                                          pause: 800  },
    { type: "alexa", text: "Thanks for using the skill! See you next time.", pause: 800  },
  ]
};
// ─────────────────────────────────────────────

document.getElementById('skill-title').textContent    = SKILL.title;
document.getElementById('skill-subtitle').textContent = SKILL.subtitle;
document.title = SKILL.title + ' — Alexa Demo';

const echo      = document.getElementById('echo');
const chat      = document.getElementById('chat');
const label     = document.getElementById('state-label');
const btnPlay   = document.getElementById('btn-play');
const btnReset  = document.getElementById('btn-reset');
const progress  = document.getElementById('progress');

// build progress dots
const userSteps = SKILL.script.filter(s => s.type === 'user');
userSteps.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'pdot';
  d.id = 'pdot-' + i;
  progress.appendChild(d);
});

let running = false;
let stepIdx = 0;
let userCount = 0;

function setState(s) {
  echo.classList.remove('state-listening','state-thinking','state-speaking');
  if (s) echo.classList.add('state-' + s);
  const map = { listening: 'Listening…', thinking: 'Thinking…', speaking: 'Speaking', '': 'Idle' };
  label.textContent = map[s] || 'Idle';
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function addBubble(type, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + type;
  b.textContent = text;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  t.id = 'typing-ind';
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
  return t;
}

function removeTyping() {
  const t = document.getElementById('typing-ind');
  if (t) t.remove();
}

async function runScript() {
  running = true;
  btnPlay.disabled = true;

  for (let i = stepIdx; i < SKILL.script.length; i++) {
    const step = SKILL.script[i];
    stepIdx = i;

    if (step.type === 'user') {
      setState('listening');
      await wait(700);
      addBubble('user', step.text);
      // update progress dot
      const dot = document.getElementById('pdot-' + userCount);
      if (dot) { dot.classList.add('done'); dot.classList.add('active'); }
      await wait(400);
      setState('thinking');
      const typing = addTyping();
      await wait(step.pause);
      removeTyping();
      userCount++;
    } else {
      // update previous dot to done-only
      const prevDot = document.getElementById('pdot-' + (userCount - 1));
      if (prevDot) { prevDot.classList.remove('active'); }
      setState('speaking');
      addBubble('alexa', step.text);
      await wait(step.pause + 400);
      setState('');
      await wait(300);
    }
  }

  stepIdx = SKILL.script.length;
  running = false;
  btnPlay.disabled = false;
  btnPlay.textContent = '▶ Replay';

  // mark last dot done
  const last = document.getElementById('pdot-' + (userCount - 1));
  if (last) last.classList.remove('active');
}

function reset() {
  if (running) return;
  stepIdx  = 0;
  userCount = 0;
  setState('');
  chat.innerHTML = '';
  btnPlay.textContent = '▶ Start Demo';
  btnPlay.disabled = false;
  document.querySelectorAll('.pdot').forEach(d => d.className = 'pdot');
}

btnPlay.addEventListener('click',  () => { if (!running) runScript(); });
btnReset.addEventListener('click', reset);
</script>
</body>
</html>
