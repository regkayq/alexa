<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marina Recipes — Alexa Skill by Kay Quade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080d14;
      --surface:   #0e1520;
      --card:      #111d2e;
      --border:    #1a2d42;
      --text:      #dde8f5;
      --muted:     #526070;
      --teal:      #00c9b1;
      --teal-dim:  rgba(0,201,177,.15);
      --blue:      #00b0ff;
      --blue-dk:   #0078d7;
      --orange:    #ffaa00;
      --green:     #00e676;
      --user-bg:   #0f2744;
      --alexa-bg:  #091929;
      --step-done: #1a3a2a;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── Page layout ── */
    .page {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      max-width: 980px;
      margin: 0 auto;
      gap: 0;
    }

    /* ── Top bar ── */
    .topbar {
      grid-column: 1 / -1;
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #007a6b, #00c9b1);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .topbar-text h1 { font-size: 1rem; font-weight: 700; color: var(--text); }
    .topbar-text p  { font-size: .72rem; color: var(--muted); margin-top: 1px; }

    .topbar-badge {
      margin-left: auto;
      font-size: .65rem;
      padding: 3px 10px;
      border-radius: 10px;
      background: var(--teal-dim);
      border: 1px solid rgba(0,201,177,.3);
      color: var(--teal);
      font-weight: 600;
      letter-spacing: .06em;
    }

    /* ── Left panel ── */
    .panel-left {
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── Echo device ── */
    .echo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .echo-body {
      position: relative;
      width: 76px;
      height: 136px;
      background: linear-gradient(160deg, #252b3a 0%, #181d28 55%, #101420 100%);
      border-radius: 38px;
      box-shadow:
        4px 10px 30px rgba(0,0,0,.8),
        inset -2px -4px 12px rgba(0,0,0,.5),
        inset 1px 2px 5px rgba(255,255,255,.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 12px;
      overflow: visible;
    }

    /* fabric lines */
    .echo-body::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(255,255,255,.022) 3px, rgba(255,255,255,.022) 4px
      );
    }

    /* dome highlight */
    .echo-body::after {
      content: '';
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 52px; height: 20px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.07) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* Ring */
    .ring-wrap {
      position: absolute;
      bottom: -7px; left: 50%;
      transform: translateX(-50%);
      width: 88px; height: 18px;
    }
    .ring {
      width: 100%; height: 100%;
      border-radius: 50%;
      position: relative;
    }
    .ring-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      transition: opacity .35s;
    }

    /* LISTENING — blue arc spin */
    .s-listening .ring-glow {
      opacity: 1;
      background: conic-gradient(var(--blue) 0deg, rgba(0,176,255,.25) 70deg, transparent 100deg, transparent 360deg);
      animation: ring-spin 1.1s linear infinite;
      filter: blur(1px);
    }
    /* THINKING — orange pulse */
    .s-thinking .ring-glow {
      opacity: 1;
      background: radial-gradient(ellipse, var(--orange) 0%, rgba(255,170,0,.15) 70%, transparent 90%);
      animation: ring-pulse 0.85s ease-in-out infinite;
    }
    /* SPEAKING — teal/cyan shimmer */
    .s-speaking .ring-glow {
      opacity: 1;
      background: conic-gradient(var(--teal) 0deg, var(--blue) 120deg, var(--teal) 240deg, var(--blue) 360deg);
      animation: ring-spin 2.2s linear infinite;
      filter: blur(.5px);
    }

    @keyframes ring-spin  { to { transform: rotate(360deg); } }
    @keyframes ring-pulse {
      0%,100% { transform: scale(1);    opacity: 1;  }
      50%      { transform: scale(1.18); opacity: .5; }
    }

    /* LED */
    .led {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #1a2030;
      box-shadow: 0 0 0 1px rgba(255,255,255,.04);
      transition: background .25s, box-shadow .25s;
      position: relative; z-index: 1;
    }
    .s-listening .led { background: var(--blue);   box-shadow: 0 0 10px var(--blue); }
    .s-thinking  .led { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    .s-speaking  .led { background: var(--teal);   box-shadow: 0 0 10px var(--teal); }

    /* Sound waves */
    .waves {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 3px;
      align-items: center;
      opacity: 0;
      transition: opacity .3s;
    }
    .waves.left  { right: calc(100% + 14px); }
    .waves.right { left:  calc(100% + 14px); }
    .s-speaking .waves { opacity: 1; }

    .bar {
      width: 2.5px;
      border-radius: 2px;
      background: var(--teal);
      animation: bar-wave .75s ease-in-out infinite;
    }
    .bar:nth-child(1) { height: 6px;  animation-delay: 0s;   }
    .bar:nth-child(2) { height: 13px; animation-delay: .1s;  }
    .bar:nth-child(3) { height: 19px; animation-delay: .2s;  }
    .bar:nth-child(4) { height: 13px; animation-delay: .3s;  }
    .bar:nth-child(5) { height: 6px;  animation-delay: .4s;  }
    .waves.left .bar { animation-direction: reverse; }
    @keyframes bar-wave {
      0%,100% { transform: scaleY(.35); opacity: .4; }
      50%      { transform: scaleY(1);   opacity: 1;  }
    }

    /* State label */
    .state-label {
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 24px;
      color: var(--muted);
      transition: color .3s;
    }
    .s-listening .state-label { color: var(--blue); }
    .s-thinking  .state-label { color: var(--orange); }
    .s-speaking  .state-label { color: var(--teal); }

    /* ── Scenario tabs ── */
    .tabs-label {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      align-self: flex-start;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .18s;
      text-align: left;
    }
    .tab:hover { background: var(--card); color: var(--text); }
    .tab.active {
      background: var(--card);
      border-color: var(--border);
      color: var(--teal);
    }
    .tab-icon { font-size: 1rem; }
    .tab-name { flex: 1; }
    .tab-count {
      font-size: .65rem;
      padding: 1px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,.05);
      color: var(--muted);
    }

    /* ── Controls ── */
    .ctrl-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .03em;
      cursor: pointer;
      transition: transform .12s, opacity .2s;
    }
    .btn:hover   { transform: translateY(-1px); }
    .btn:active  { transform: translateY(0); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .btn-play  { background: linear-gradient(135deg, #007a6b, var(--teal)); color: #fff; }
    .btn-reset { background: var(--card); border: 1px solid var(--border); color: var(--muted); }

    /* ── Right panel ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      padding: 24px 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 320px;
      max-height: 420px;
    }

    .bubble {
      max-width: 84%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: .82rem;
      line-height: 1.55;
      animation: pop-in .25s ease both;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 3px;
      color: #b8d4f0;
    }
    .bubble.user::before { content: '🎙 '; font-size: .72em; }
    .bubble.alexa {
      align-self: flex-start;
      background: var(--alexa-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: #9ecfee;
    }
    .bubble.alexa::before { content: '◉ '; color: var(--teal); font-size: .72em; }

    .typing-ind {
      display: flex;
      gap: 4px;
      padding: 9px 14px;
      align-self: flex-start;
      background: var(--alexa-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 3px;
      animation: pop-in .25s ease both;
    }
    .tdot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--teal);
      animation: tdot-anim .85s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .2s; }
    .tdot:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot-anim {
      0%,80%,100% { transform: scale(.5); opacity: .3; }
      40%          { transform: scale(1);  opacity: 1;  }
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(6px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Recipe card ── */
    .recipe-panel {
      border-top: 1px solid var(--border);
      padding: 16px 24px 20px;
      min-height: 120px;
    }

    .recipe-card {
      display: none;
      animation: pop-in .3s ease both;
    }
    .recipe-card.visible { display: block; }

    .recipe-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .recipe-emoji { font-size: 1.4rem; }
    .recipe-name  { font-size: .9rem; font-weight: 700; color: var(--text); }
    .recipe-meal  { font-size: .68rem; color: var(--teal); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-top: 1px; }

    .recipe-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .recipe-section-title {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .ingredient-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .ingredient-list li {
      font-size: .75rem;
      color: #8aa8c0;
      padding-left: 10px;
      position: relative;
    }
    .ingredient-list li::before {
      content: '·';
      position: absolute;
      left: 0;
      color: var(--teal);
    }

    .step-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .step-item {
      display: flex;
      gap: 8px;
      font-size: .75rem;
      color: #8aa8c0;
      transition: color .3s, background .3s;
      padding: 3px 6px;
      border-radius: 5px;
    }
    .step-item.active {
      background: rgba(0,201,177,.08);
      color: var(--teal);
    }
    .step-item.done {
      background: var(--step-done);
      color: #4a8a6a;
    }
    .step-num {
      font-size: .65rem;
      font-weight: 700;
      color: var(--teal);
      min-width: 16px;
      margin-top: 1px;
      opacity: .7;
    }
    .step-item.done .step-num { color: #4a8a6a; }

    /* empty state */
    .recipe-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 80px;
      color: var(--muted);
      font-size: .78rem;
    }

    /* progress bar */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px 0;
    }
    .progress-label { font-size: .65rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill  { height: 100%; background: var(--teal); border-radius: 2px; width: 0%; transition: width .4s ease; }
    .progress-pct   { font-size: .65rem; color: var(--teal); font-weight: 600; min-width: 28px; text-align: right; }
  </style>
</head>
<body>
<div class="page">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-icon">🍳</div>
    <div class="topbar-text">
      <h1>Marina Recipes</h1>
      <p>5 Minute Recipes · Alexa Skill by Kay Quade</p>

  <!-- Left panel -->

    <div class="echo-wrap" id="echo">

        <div class="bar"></div><div class="bar"></div>

  <!-- Right panel -->
  <main class="panel-right">

    <div class="progress-row">

          <div>
            <div class="recipe-section-title">Steps</div>

          </div>
        </div>
      </div>
    </div>

  </main>
</div>

// ────────────────────────────────────────────────────────────
//  STATE
// ────────────────────────────────────────────────────────────
let currentScenario = SCENARIOS[0];
let running = false;
let stepIdx = 0;

const echo       = document.getElementById('echo');
const stateLabel = document.getElementById('state-label');
const chat       = document.getElementById('chat');
const btnPlay    = document.getElementById('btn-play');
const btnReset   = document.getElementById('btn-reset');
const progFill   = document.getElementById('prog-fill');
const progPct    = document.getElementById('prog-pct');
const recipeCard        = document.getElementById('recipe-card');
const recipePlaceholder = document.getElementById('recipe-placeholder');
const rcEmoji       = document.getElementById('rc-emoji');
const rcName        = document.getElementById('rc-name');
const rcMeal        = document.getElementById('rc-meal');
const rcIngredients = document.getElementById('rc-ingredients');
const rcSteps       = document.getElementById('rc-steps');

// Build tabs
const tabsEl = document.getElementById('tabs');
SCENARIOS.forEach(sc => {
  const btn = document.createElement('button');
  const recipeCount = Object.keys(MEAL_DATA[sc.meal].recipes).length;
  btn.className = 'tab' + (sc === currentScenario ? ' active' : '');
  btn.innerHTML = `<span class="tab-icon">${sc.icon}</span><span class="tab-name">${sc.label}</span><span class="tab-count">${recipeCount} recipes</span>`;
  btn.addEventListener('click', () => {
    if (running) return;
    currentScenario = sc;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    reset();
  });
  tabsEl.appendChild(btn);
});

// ── Helpers ──
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function setState(s) {
  echo.classList.remove('s-listening','s-thinking','s-speaking');
  if (s) echo.classList.add('s-' + s);
  const map = { listening:'Listening…', thinking:'Thinking…', speaking:'Speaking', '':'Idle' };
  stateLabel.textContent = map[s] || 'Idle';
}

function setProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  progFill.style.width = pct + '%';
  progPct.textContent  = pct + '%';
}

function addBubble(type, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + type;
  b.textContent = text;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const t = document.createElement('div');
  t.className = 'typing-ind';
  t.id = 'typing-ind';
  t.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typing-ind');
  if (t) t.remove();
}

function showRecipeCard(mealKey, recipeKey) {
  const recipe = MEAL_DATA[mealKey].recipes[recipeKey];
  if (!recipe) return;

  rcEmoji.textContent = recipe.emoji;
  rcName.textContent  = recipe.name;
  rcMeal.textContent  = mealKey.toUpperCase();

  rcIngredients.innerHTML = '';
  recipe.ingredients.forEach(ing => {
    const li = document.createElement('li');
    li.textContent = ing;
    rcIngredients.appendChild(li);
  });

  rcSteps.innerHTML = '';
  recipe.steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'step-item';
    li.id = 'step-' + i;
    li.innerHTML = `<span class="step-num">${i + 1}</span><span>${step}</span>`;
    rcSteps.appendChild(li);
  });

  recipePlaceholder.style.display = 'none';
  recipeCard.classList.add('visible');
}

function highlightStep(index) {
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.remove('active','done');
    if (i < index)  el.classList.add('done');
    if (i === index) el.classList.add('active');
  });
}

function resetRecipeCard() {
  recipeCard.classList.remove('visible');
  recipePlaceholder.style.display = '';
  rcIngredients.innerHTML = '';
  rcSteps.innerHTML = '';
}

// ── Main runner ──
async function runScript() {
  running = true;
  btnPlay.disabled = true;
  const script = currentScenario.script;
  const total  = script.length;

  for (let i = stepIdx; i < script.length; i++) {
    stepIdx = i;
    const step = script[i];
    setProgress(i, total);

    if (step.type === 'user') {
      setState('listening');
      await wait(500);
      addBubble('user', step.text);
      setState('thinking');
      addTyping();
      await wait(step.pause);
      removeTyping();
    } else {
      setState('speaking');
      addBubble('alexa', step.text);

      if (step.showRecipe) {
        await wait(300);
        showRecipeCard(currentScenario.meal, currentScenario.recipe);
      }
      if (step.activeStep !== undefined) {
        highlightStep(step.activeStep);
      }
      await wait(step.pause + 300);
      setState('');
      await wait(200);
    }
  }

  setProgress(total, total);
  stepIdx = script.length;
  running = false;
  btnPlay.disabled = false;
  btnPlay.textContent = '▶ Replay';
}

function reset() {
  if (running) return;
  stepIdx = 0;
  setState('');
  chat.innerHTML = '';
  resetRecipeCard();
  setProgress(0, 1);
  btnPlay.textContent = '▶ Play';
  btnPlay.disabled = false;
}

btnPlay.addEventListener('click',  () => { if (!running) runScript(); });
btnReset.addEventListener('click', reset);
</script>
